# config.example.toml
#
# Copy this file to config.toml and fill in your API keys.
# Only the settings below are used by this pipeline — everything
# LLM-related, server-related, and WebUI-related has been removed.
#
#   cp config.example.toml config.toml

[app]

# ---------------------------------------------------------------------------
# Stock video providers (used when job sentences have media_type = "video")
# ---------------------------------------------------------------------------

# Primary stock video source: "pexels" or "pixabay"
video_source = "pexels"

# Pexels API key — register at https://www.pexels.com/api/
# Multiple keys are supported to spread rate limits:
#   pexels_api_keys = ["key1", "key2"]
pexels_api_keys = []

# Pixabay API key — register at https://pixabay.com/api/docs/
# Multiple keys are supported:
#   pixabay_api_keys = ["key1", "key2"]
pixabay_api_keys = []

# ---------------------------------------------------------------------------
# Image providers (used when job sentences have media_type = "image")
# Searched in order: DuckDuckGo → Wikimedia Commons → Pexels Photos → Pixabay Images → Unsplash
# DuckDuckGo and Wikimedia Commons need no key; the others use the keys above / below.
# ---------------------------------------------------------------------------

# Unsplash API key — register at https://unsplash.com/developers
# Single key:  unsplash_api_keys = "your_key"
# Multiple:    unsplash_api_keys = ["key1", "key2"]
unsplash_api_keys = []

# ---------------------------------------------------------------------------
# Serper API (Google Images) -- used for content_track="named" sentences
# (specific products, people, places, events) where generic stock libraries
# are unlikely to have the exact subject. Register at https://serper.dev/
# Multiple keys supported: serper_api_keys = ["key1", "key2"]
# If unset, content_track="named" sentences silently skip Serper and fall
# back to the rest of named_track_image_source_order below.
# ---------------------------------------------------------------------------
serper_api_keys = []

# Provider order for content_track="named" sentences. "serper" (Google
# Images) is first -- most likely to have a real photo of a specific named
# product/person/place/event that stock-photo libraries don't carry.
# wikimedia/openverse rank ahead of stock libraries here: stock rarely carries
# named entities or evidence imagery (diagrams, schematics), open archives often do.
# nasa/archive_org/smithsonian are free archival/documentary sources (public-
# domain space/historical imagery, museum collections) -- grouped with the
# other open archives, ahead of commercial stock. All three silently return
# no results (nasa/archive_org) or skip (smithsonian, needs an API key) if
# the subject isn't in their collections, so ordering them early costs
# nothing when they come up empty.
named_track_image_source_order = ["serper", "duckduckgo", "wikimedia", "nasa", "archive_org", "smithsonian", "pexels", "pixabay", "unsplash"]

# Smithsonian Open Access API key -- free, instant self-serve registration
# at https://api.data.gov/signup/. If unset, Smithsonian is silently skipped
# (same "skip if unconfigured" convention as serper_api_keys above).
smithsonian_api_keys = []

# ---------------------------------------------------------------------------
# Openverse (openly licensed images: Flickr Commons, Wikimedia, museums) —
# best free source for diagrams/schematics/evidence imagery. Anonymous access
# is Cloudflare-blocked from server IPs, so register a free API client:
#   python scripts/register_openverse.py --name "..." --email "..." \
#       --description "..." --write-config
# (drop --write-config to just print the credentials instead of editing this
# file). Without them the provider silently sits on cooldown (no errors, no
# results).
# ---------------------------------------------------------------------------
openverse_client_id = ""
openverse_client_secret = ""

# ---------------------------------------------------------------------------
# Footage/image mix and relevance filtering
# ---------------------------------------------------------------------------

# Soft cap on the fraction of sentences that may use still images, regardless
# of how the job's per-sentence media_type values are set. If this ratio
# would be exceeded, the pipeline tries video first for that sentence
# (falling back to image only if no video is found).
max_image_ratio = 0.25

# CLIP-based relevance filtering for image/footage search results. Scores
# each candidate against the sentence's "visual_caption" (falling back to
# "search_term, video_topic" if absent) and reorders/drops poor matches
# before they reach the final video. Requires onnxruntime + tokenizers (see
# requirements.txt) and downloads ~600MB of CLIP model weights to
# storage/models/clip-vit-b32/ on first use. If a dependency is missing or
# the model fails to load/download, this is automatically a no-op and the
# pipeline behaves exactly as it did before.
relevance_filter_enabled = true

# A candidate is accepted only if its score against visual_caption beats the
# worst-scoring "junk" anchor (watermark, unrelated stock photo, blurry, etc)
# by at least this margin (roughly 0-1, typically ~0.01-0.05 for CLIP
# ViT-B/32). There is no fixed global threshold -- this margin is what
# replaces it. STARTING POINT ONLY -- calibrate using RELEVANCE_LOG_ONLY=1
# (see AGENT_GUIDE.md) before relying on this for a real run.
relevance_margin = 0.02

# Floor for the below-margin "best available" image fallback (the last resort
# when NO candidate clears relevance_margin). Applies only to broll sentences
# at low/medium criticality — named-track and high/critical sentences never
# below-margin-accept; they return empty so the rescue ladder (entity cousins
# → gapfill terms → placeholder) fills the slot with something on-topic
# instead of a known-weak match.
image_fallback_min_score = 0.20

# Web-image screening extensions (merged into the built-in lists in
# app/services/media/images.py). Blocked domains are hard-skipped (social
# crawler proxies, video-thumb CDNs); penalized domains (retail rehosts like
# Amazon/Pinterest) only sort last; junk keywords drop results whose title
# marks non-photographic content (cartoon/clipart/vector/...) unless the
# search query itself asks for it.
image_blocked_domains_extra = []
image_penalized_domains_extra = []
image_junk_keywords_extra = []

# Number of evenly-spaced frames sampled from each video candidate for
# relevance scoring, and how those per-frame scores are combined.
relevance_video_frame_samples = 4
relevance_video_pool = "mean"  # "mean" | "max"

# Parallel clip-fetch workers. Fetching is network/API bound (stock search +
# download + NSFW/CLIP/VLM screening), so more workers shorten the fetch
# phase roughly linearly until provider rate limits push back.
clip_fetch_workers = 6

# Final render engine. true = single-pass ffmpeg (libass subtitle burn-in,
# pre-rendered BGM duck, ~5x faster than the MoviePy compositor). Word
# highlights, rounded subtitle backgrounds, and custom subtitle positions
# automatically fall back to MoviePy, as does any ffmpeg failure.
ffmpeg_final_render = true

# How many candidates (downloaded + verified against the NSFW gate and the
# relevance margin) are tried per video clip slot before giving up.
max_video_download_attempts = 3

# Same as above, but for content_track="named" sentences (a specific
# product/person/place). Video is only a fallback for named sentences (they
# always try an image first, see named_track_image_source_order), but this
# keeps the extra rigor consistent for named_entity broll that explicitly
# requests video. Defaults to max_video_download_attempts + 3 if unset.
# max_video_download_attempts_named = 6

# Time budget (seconds) for each Phase B "rescue fetch" attempt -- an extra
# attempt using generic fallback terms when a slot's primary fetch has
# already exhausted the job's own concept pool. Without a rescue, a failed
# slot falls back to looping the previous clip, which is the "same clip
# repeats over and over" artifact. Kept short since this only runs for the
# minority of slots that already failed once.
clip_rescue_budget_seconds = 25

# How many distinct generic gap-fill terms to try (each within its own
# clip_rescue_budget_seconds) before giving up and falling back to the
# placeholder loop. A single term can turn up zero candidates just as easily
# as the sentence's own concepts did -- more attempts meaningfully cut how
# often a slot falls through to the placeholder loop.
clip_rescue_max_attempts = 3

# How many search-result candidates are downloaded and relevance-scored per
# search term (when relevance filtering is on) before moving to the next
# term. Higher = more thorough but more download/scoring cost per sentence.
image_candidates_per_term = 6

# Same as above, but for content_track="named" sentences. Named entities
# benefit more from trying harder to find the one real photo; generic
# broll's pool is broad enough that extra candidates rarely change the
# outcome.
image_candidates_per_term_named = 10

# Log every candidate's relevance score at debug level (for calibration).
relevance_debug_log = false

# ---------------------------------------------------------------------------
# NSFW pixel-level gate (NudeNet ONNX) -- mandatory, hard-reject, independent
# of CLIP/relevance. Every downloaded image and sampled video frame is
# scanned; a hit on exposed genitalia/breasts/buttocks is rejected outright
# regardless of relevance score. Requires the `nudenet` package (see
# requirements.txt) -- a small (~12MB) ONNX model bundled with the package,
# no download needed. If the dependency is missing or fails to load, this is
# automatically a no-op (relevance/tag-based filtering still applies).
# ---------------------------------------------------------------------------
nsfw_gate_enabled = true

# Per-label confidence (0-1) above which a detection triggers a reject.
nsfw_threshold = 0.25

# Number of evenly-spaced frames sampled from each video candidate for the
# NSFW gate (the whole clip is rejected if ANY sampled frame trips it).
nsfw_frame_samples = 4

# ---------------------------------------------------------------------------
# VLM image/video verification (OpenAI) — post-download quality gate
# Sends each downloaded image (or midpoint frame for video clips) to a vision
# model along with the narration sentence, visual intent, and topic. Rejects
# footage that is clearly off-topic, contains watermarks or heavy text, or
# doesn't match the narration moment. Runs AFTER the NSFW gate and BEFORE
# the CLIP relevance margin — so NSFW hard-rejects still happen independently.
# Fail-open: any API error silently falls through to CLIP-based filtering.
#
# Requires an OpenAI API key (platform.openai.com). gpt-4.1-nano costs
# roughly $0.002 per video at 10 clips — cheapest available vision model.
# ---------------------------------------------------------------------------
vlm_verify_enabled = false

# Your OpenAI API key.
# vlm_api_key = "your_key_here"
vlm_api_key = ""

# OpenAI vision model. gpt-4.1-nano is the cheapest option (~$0.002/video).
# Upgrade to gpt-4o-mini or gpt-4.1-mini for more accuracy.
vlm_model = "gpt-4.1-nano"

# Reject a candidate if the model returns a relevance score below this threshold
# (0.0–1.0). 0.55 means "must be a reasonable match" without being too strict.
vlm_threshold = 0.55

# Looser VLM gate for stock-VIDEO candidates on generic broll sentences (no
# must_show, low/medium criticality). The scoring prompt caps generic footage
# at <=0.4 whenever the visual intent names anything specific, which under a
# brand-heavy topic blocks ALL stock video at vlm_threshold — while images
# pass the separate 0.30 image gate (vlm_image_threshold). 0.35 restores
# symmetry; named/must_show/high-criticality sentences keep vlm_threshold.
vlm_threshold_broll = 0.35

# Comparative pooling: instead of claiming the first image candidate that
# individually passes NSFW + the vlm_threshold check above, gather several
# passing candidates and show them to the VLM together in one request, which
# picks the single best match -- more reliable than independent per-candidate
# scoring for "which of these is right." "off" | "named" | "all" -- which
# content_track values this applies to. Default "named" spends the extra VLM
# call only where a wrong pick is most noticeable (a specific product/person/
# place); "broll" stays on today's cheaper first-pass-accept behavior.
vlm_compare_scope = "named"

# How many individually-accepted candidates to gather before running one
# comparative call. Higher = better odds of the true best match, more VLM
# cost/latency per pooled sentence. Capped at 5 regardless of this value.
vlm_compare_pool_size = 3

# ---------------------------------------------------------------------------
# Embedding-based de-duplication at clip selection
# Rejects any candidate whose CLIP embedding is too similar to a recently
# placed shot, keeping the visual variety high even when the search pool is
# small.  Uses the same CLIP model already loaded for relevance ranking — no
# extra model or download needed.  Degrades to a silent no-op if the CLIP
# model is unavailable (same pattern as relevance_filter_enabled).
# ---------------------------------------------------------------------------
dedup_enabled = true

# Cosine-similarity threshold (0–1) above which a candidate is considered a
# near-duplicate of a recently placed shot.  CLIP ViT-B/32 space: values in
# the 0.90–0.95 range catch tight visual repetition; lower values reject more
# aggressively.  Start with 0.92 and tune down if you still see repetition.
dedup_similarity_threshold = 0.92

# How many of the most recently placed shots to compare each new candidate
# against.  -1 = unbounded (remembers every accepted clip for the whole job
# -- recommended, since a bounded window forgets old entries once that many
# newer clips are accepted, letting the same stock footage resurface later
# in a long video).  0 disables de-dup entirely; a positive N bounds the
# window to the last N clips.
dedup_lookback_window = -1

# ---------------------------------------------------------------------------
# Coverr — supplemental cinematic B-roll source
# Strongest for nature, lifestyle, architecture, and abstract themes.
# Coverr results are appended after Pexels/Pixabay for each ladder rung,
# so they're only tried when the primary source runs thin.
# Requires an API key — register free at https://coverr.co/developers
# Without a key the source is silently skipped (coverr_enabled has no effect).
# ---------------------------------------------------------------------------
coverr_enabled = true

# API key from coverr.co/developers (required even for free tier).
# coverr_api_key = "your_key_here"

# ---------------------------------------------------------------------------
# Motion score gate — rejects static "video" clips
# Clips where no adjacent-frame pair differs by more than motion_min_score
# (fraction of full-scale, 0–1) are rejected before relevance or dedup
# checks.  This eliminates photographs exported as MP4 and near-frozen zooms
# that look like a broken slideshow in the final video.
# ---------------------------------------------------------------------------
motion_filter_enabled = true

# Maximum frame-to-frame difference below which a clip is considered static.
# 0.03–0.05 rejects near-frozen clips without discarding slow pans.
motion_min_score = 0.04

# ---------------------------------------------------------------------------
# Background music — online fetch
# ---------------------------------------------------------------------------

# Online BGM search uses your existing pixabay_api_keys above.
# When bgm_search_term is set in a job JSON, the pipeline searches Pixabay
# Music and downloads a track instead of picking a file from resource/songs/.
# No extra key or registration required.

# ---------------------------------------------------------------------------
# Subtitle generation
# ---------------------------------------------------------------------------

# "edge"    — uses edge_tts word-timing (fast, no extra model needed)
# "whisper" — uses faster-whisper for higher accuracy on unclear audio
subtitle_provider = "edge"

# ---------------------------------------------------------------------------
# BGM audio ducking
# ---------------------------------------------------------------------------

# Volume fraction applied to BGM while narration is active.
# 0.15 = BGM drops to 15% of its normal level under speech.
# Set to 1.0 to disable ducking entirely.
bgm_duck_ratio = 0.15

# ---------------------------------------------------------------------------
# SFX (one-shot sound effects, mood-triggered — see app/services/render/sfx.py)
# ---------------------------------------------------------------------------

# Master on/off switch for the SFX layer.
sfx_enabled = true

# Global multiplier applied on top of each cue's own library volume.
# Every cue is also hard-capped to 3.5s (with a short fade-out) regardless of
# its source file's length — see _SFX_MAX_CUE_SECONDS in generate.py.
sfx_volume_scale = 0.5

# ---------------------------------------------------------------------------
# Crossfade transition style (concat_video_clips_with_crossfade in combine.py)
# ---------------------------------------------------------------------------

# ffmpeg xfade transition name used between clips. "fade" is a plain dissolve;
# "hblur" reads as a fast horizontal-blur "whip" cut. See _XFADE_TRANSITIONS
# in combine.py for the full whitelist.
crossfade_transition = "fade"

# ---------------------------------------------------------------------------
# Provider search-response cache (app/services/media/_search_cache.py)
# ---------------------------------------------------------------------------

# Caches raw provider SEARCH responses (not downloaded assets, which already
# have their own cache_images/cache_videos/cache_bgm dirs). Default true —
# unlike vidspeed's default-off, AMPT's job lifecycle re-runs the same
# title's queries on portal's automatic "<title> (2)", "(3)"... retries, so
# the win is bigger and staleness risk is low within a TTL window.
search_cache_enabled = true
search_cache_ttl_seconds = 86400

# ---------------------------------------------------------------------------
# TLS / network
# ---------------------------------------------------------------------------

# Verify TLS certificates on outbound requests (Pexels, Pixabay, Unsplash).
# Only set to false in corporate proxy / self-signed cert environments.
tls_verify = true

# Timeout in seconds for a single edge_tts streaming request.
# Increase on slow VPS networks; set to 0 to disable.
edge_tts_timeout = 30

# TTS engine: "edge" or "kokoro"
tts_engine = "edge"
# Paths relative to repo root by default
kokoro_venv = "kokoro-venv"
kokoro_model_path = "resource/kokoro/kokoro-v1.0.onnx"
kokoro_voices_path = "resource/kokoro/voices-v1.0.bin"
kokoro_lang = "en-us"

# Minimax cloud TTS settings.
# Use prefix "minimax:" in voice_name, e.g. "minimax:Wise_Woman"
minimax_api_key   = ""
minimax_group_id  = ""
minimax_model     = "speech-02-hd"   # or "speech-02-turbo" for faster/cheaper

# Which backend actually serves "minimax:" voice_name requests:
#   "algrow" (default) — routes through Algrow's proxy (cheaper billing);
#     requires the moss_audio_* voice_id to have an entry in
#     minimax_algrow_voice_map below (Algrow uses its own cloned-voice
#     namespace, not Minimax's — see scripts/algrow_clone_from_minimax.py).
#   "direct" (dormant) — calls Minimax's own API above directly.
minimax_provider = "algrow"

# Algrow (https://algrow.online) — TTS proxy, cheaper than calling
# Minimax directly, and also the source of "elevenlabs:" voices (Algrow's own
# premade ElevenLabs catalog -- those voice_ids are used directly, no
# cloning/mapping step like minimax_algrow_voice_map below).
algrow_api_key = ""

# Overall deadline per generate-simple call: submit + status polling +
# download. A live end-to-end test on 2026-07-14 took ~9.7 minutes for a
# 17s/259-char clip -- set generously above that observed latency.
algrow_timeout_seconds = 1200

# ---------------------------------------------------------------------------
# Local storage
# ---------------------------------------------------------------------------

# Where downloaded stock clips and images are cached.
# ""     — default: ./storage/cache_videos  /  ./storage/cache_images
# "task" — download into each task's own folder (disables cross-task cache)
# "/absolute/path" — custom directory
material_directory = ""

# ---------------------------------------------------------------------------
# AI avatar (talking-head: Segmind / RunPod InfiniteTalk)
# ---------------------------------------------------------------------------

# Master switch. The pipeline also requires the active provider's API key (or
# avatar_dry_run) — with the feature off/unconfigured, avatar-marked jobs
# degrade gracefully to normal footage.
avatar_enabled = false

# Which backend generates the talking-head clip: "segmind" (default, active)
# or "runpod" (dormant fallback -- kept intact for easy reversion, see
# app/services/avatar.py's _provider()).
avatar_provider = "segmind"

# Segmind API key. Only used when avatar_provider = "segmind". Never
# committed -- config.toml is gitignored.
segmind_api_key = ""

# Segmind's async InfiniteTalk endpoint; /requests/{id}/status and
# /requests/{id} are appended for polling.
segmind_endpoint = "https://api.segmind.com/v2/infinite-talk"

# RunPod API key (Bearer). Only used when avatar_provider = "runpod".
runpod_api_key = ""

# Public InfiniteTalk endpoint; /runsync and /status/{id} are appended.
# Only used when avatar_provider = "runpod".
runpod_endpoint = "https://api.runpod.ai/v2/infinitetalk"

# Generation resolution: "480p" or "720p" (RunPod: $0.25/$0.50 per gen).
# Segmind's `resolution` field additionally accepts "576p" if wanted later.
# Output is normalized (scale+pad) to the timeline resolution afterward.
avatar_size = "720p"

# Overall deadline per generation: submit + status polling + download.
# 1200s -- a live probe on 2026-07-12 saw ~12 min of RunPod queue delay alone
# before generation even started (actual compute was only ~3.8 min for a 30s
# clip); 600s risked giving up before the queue cleared. A Segmind probe on
# 2026-07-14 saw near-instant queueing (~0.04s) and ~73s inference for a 3s
# test clip -- kept the same 1200s ceiling as a safe cap for longer clips.
avatar_timeout_seconds = 1200

# Motion prompt sent with every generation.
avatar_prompt = "A person speaking directly to the camera, natural expression, subtle head movement"

# InfiniteTalk only accepts URL inputs, so per-job audio slices and the
# avatar image are copied under avatar_assets_dir (served publicly at
# avatar_public_base_url via Caddy) and deleted when the job finishes.
avatar_public_base_url = "https://autovidgen.duckdns.org/ai-assets"
avatar_assets_dir = "/home/deploy/portal/data/avatar-assets"

# true = skip the provider entirely and render a labeled slate clip (testing).
avatar_dry_run = false

# ---------------------------------------------------------------------------
# FFmpeg / video codec  (optional overrides)
# ---------------------------------------------------------------------------

# Path to ffmpeg binary. Leave commented out to use the system PATH.
# ffmpeg_path = "/usr/bin/ffmpeg"

# Video encoder. libx264 is the safest default.
# Options: "libx264", "h264_nvenc", "h264_amf", "h264_qsv", "h264_videotoolbox"
# video_codec = "libx264"

# Maps our stable "minimax:" voice_name (Minimax's own moss_audio_* id) to the
# voice_id Algrow issued after cloning that same reference voice into its own
# account. Filled in by scripts/algrow_clone_from_minimax.py. This table must
# stay last in [app] -- a bracketed subtable in TOML captures every key that
# follows it until the next [section] header.
[app.minimax_algrow_voice_map]


# ---------------------------------------------------------------------------
# [whisper]
# Used only when subtitle_provider = "whisper"
# ---------------------------------------------------------------------------

# Controls the faster-whisper model used in TWO places:
#   1. Always — sentence timestamp alignment in pipeline.py
#      (maps each sentence to its exact start/end time in the audio)
#   2. When subtitle_provider = "whisper" — .srt subtitle generation
#      (default is "edge" above, which skips this step)
[whisper]
# CPU-only VPS settings — "base" model keeps RAM usage low.
# Upgrade to "medium" or "large-v3" on machines with more RAM/CPU budget.
model_size = "base"
device = "cpu"
compute_type = "int8"

# Max seconds to wait for sentence-timestamp transcription (whisper
# alignment stage) before giving up and falling back to uniform timestamps.
timeout_seconds = 1800


# ---------------------------------------------------------------------------
# [proxy]
# HTTP/HTTPS proxy for all outbound API and download requests.
# ---------------------------------------------------------------------------

[proxy]
# Format: "http://user:pass@host:port"
# http  = "http://10.10.1.10:3128"
# https = "http://10.10.1.10:1080"
